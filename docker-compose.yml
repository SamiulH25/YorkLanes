# YorkLanes production stack (API + Astro SSR + Caddy HTTPS).
#
# Prerequisites:
#   1. Copy apps/api/.env.example → apps/api/.env and fill in secrets.
#   2. Point yorklanes.SamiulH25.com DNS at this machine.
#   3. Add the Google OAuth redirect URI:
#      https://yorklanes.SamiulH25.com/api/auth/google/callback
#
# Start:
#   docker compose up -d --build
#
# With built-in Caddy HTTPS (only if ports 80/443 are free):
#   docker compose --profile caddy up -d --build
#
# On this machine, nginx handles HTTPS instead — see docker/nginx/README.md
#
# Logs:
#   docker compose logs -f
#
# Stop:
#   docker compose down

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: yorklanes-api
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      API_BIND: 0.0.0.0
      WEB_ORIGIN: ${WEB_ORIGIN:-https://yorklanes.SamiulH25.com}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://yorklanes.SamiulH25.com/api/auth/google/callback}
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3001/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-https://yorklanes.SamiulH25.com}
        API_INTERNAL_URL: http://api:3001
    container_name: yorklanes-web
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://yorklanes.SamiulH25.com}
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4321:4321"
    expose:
      - "4321"
    restart: unless-stopped

  # Optional: built-in HTTPS reverse proxy. Skip if ports 80/443 are already used
  # (point your existing proxy at http://127.0.0.1:4321 instead).
  # Start with: docker compose --profile caddy up -d
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    container_name: yorklanes-caddy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
